# ==============================================================================
# 1. ЕРГОНОМІКА ТА ПРЕФІКС
# ==============================================================================
# Зміна префіксу на Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Перезапуск конфігу: Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Конфігурацію оновлено!"

# Увімкнення миші
set -g mouse on

# Підтримка True Color (важливо для тем LazyVim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Cc=\E]12;%p1%s\007"

set-option -g status-position top


# ==============================================================================
# 2. ВІКНА ТА ПАНЕЛІ (Індексація з 0)
# ==============================================================================
set -g base-index 0
set -g pane-base-index 0
set-window-option -g pane-base-index 0
set-option -g renumber-windows on

# Логічні спліти у поточній директорії
# unbind '"'
# unbind %
# bind | split-window -h -c "#{pane_current_path}"
# bind - split-window -v -c "#{pane_current_path}"

# Навігація Vim (також працює через vim-tmux-navigator без префіксу)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Повернути очищення екрана через <prefix> C-l
bind C-l send-keys 'C-l'

# Переключение между окнами (вкладками) через Alt + Стрелки (без префикса)
bind -n M-p previous-window
bind -n M-n next-window

# Автоматически перенумеровывать окна при закрытии одного из них
set -g renumber-windows on

# Автоматическое обновление названий вкладок в зависимости от запущенной программы
setw -g automatic-rename on

# ==============================================================================
# 3. РЕЖИМ КОПІЮВАННЯ (Kubuntu / Linux Xclip)
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ==============================================================================
# 4. ВАШІ НАЛАШТУВАННЯ LAZY-TMUX (Збереження та Попапи)
# ==============================================================================
run-shell -b 'lazy-tmux daemon --interval 3m --scrollback >/tmp/lazy-tmux.log 2>&1 || tmux display-message "lazy-tmux daemon already running"'
bind-key f display-popup -B -E 'lazy-tmux picker'
bind-key C-s run-shell 'lazy-tmux save --all --scrollback && tmux display-message "All sessions saved successfully!"'

# ==============================================================================
# 5. ПЛАГІНИ (Багатий інтерфейс через TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # Навігація між LazyVim та Tmux
set -g @plugin 'tmux-plugins/tmux-cpu' # Постачає #{cpu_percentage}/#{ram_percentage} для статус-бару

# Примітка: tmux-resurrect не потрібен, бо вже працює daemon від lazy-tmux!

# ------------------------------------------------------------------------------
# НАЛАШТУВАННЯ СТАТУС-БАРУ (Catppuccin - Максимальний інформативний стиль)
# ------------------------------------------------------------------------------
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha' # Темна насичена тема
set -g @catppuccin_window_status_style "rounded"

# Конфігурація відображення вікон
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

# Конфігурація статус-модулів (Шлях, сесія, дата/час)
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# cpu.conf плагіна catppuccin віддає tmux-cpu колір тексту як "#{E:@thm_fg}",
# а tmux-cpu читає опції через show-option (без розгортання форматів) і
# отримує биту строку замість кольору — тому колір тексту/фону цих двох
# модулів задаємо самі, за тим самим патерном, що й інші модулі
set -g @catppuccin_status_cpu_text_fg "#{E:@thm_fg}"
set -g @catppuccin_status_cpu_text_bg "#{E:@catppuccin_status_module_text_bg}"
set -g @catppuccin_status_ram_text_fg "#{E:@thm_fg}"
set -g @catppuccin_status_ram_text_bg "#{E:@catppuccin_status_module_text_bg}"

# Дефолтна іконка RAM (U+EFC5) відсутня у встановлених Nerd Font (є лише Hack
# Nerd Font, не JetBrains Mono Nerd Font) і рендериться порожнім квадратом —
# замінюємо на іконку "memory" з Material Design Icons (U+F035B), яку
# Hack Nerd Font покриває (перевірено через fc-match ":charset=F035B")
set -g @catppuccin_ram_icon "󰍛 "

set -g status-left "#[bg=default] "
# Дефолт tmux — лише 40 символів, наш статус-бар (шлях+сесія+час+cpu+ram)
# довший і мовчки обрізається без цього
set -g status-right-length 150
set -g status-left-length 150

# Автосинхронізація день/ніч з Kitty через нативні хуки tmux (>=3.4)
# Кольори кожного статус-модуля (@catppuccin_<module>_color та
# @catppuccin_status_<module>_icon_fg/icon_bg/text_fg) кешуються плагіном
# лише при першому встановленні (-ogqF) і НЕ входять у список @catppuccin_reset,
# тож без ручного unset вони назавжди залишаються кольорами першого flavor'у.
set-hook -g client-dark-theme {
  set -g @catppuccin_flavor "mocha"
  set -g @catppuccin_reset "true"
  set -gqu @catppuccin_directory_color
  set -gqu @catppuccin_session_color
  set -gqu @catppuccin_date_time_color
  set -gqu @catppuccin_cpu_color
  set -gqu @catppuccin_ram_color
  set -gqu @catppuccin_status_directory_icon_fg
  set -gqu @catppuccin_status_directory_icon_bg
  set -gqu @catppuccin_status_directory_text_fg
  set -gqu @catppuccin_status_session_icon_fg
  set -gqu @catppuccin_status_session_icon_bg
  set -gqu @catppuccin_status_session_text_fg
  set -gqu @catppuccin_status_date_time_icon_fg
  set -gqu @catppuccin_status_date_time_icon_bg
  set -gqu @catppuccin_status_date_time_text_fg
  set -gqu @catppuccin_status_cpu_icon_fg
  set -gqu @catppuccin_status_cpu_icon_bg
  set -gqu @catppuccin_status_ram_icon_fg
  set -gqu @catppuccin_status_ram_icon_bg
  run-shell "~/.config/tmux/plugins/tmux/catppuccin.tmux"
  set -g status-right "#{E:@catppuccin_status_directory}"
  set -ag status-right "#{E:@catppuccin_status_session}"
  set -ag status-right "#{E:@catppuccin_status_date_time}"
  set -agF status-right "#{E:@catppuccin_status_cpu}"
  set -agF status-right "#{E:@catppuccin_status_ram}"
  run-shell "~/.config/tmux/plugins/tmux-cpu/cpu.tmux"
}
set-hook -g client-light-theme {
  set -g @catppuccin_flavor "latte"
  set -g @catppuccin_reset "true"
  set -gqu @catppuccin_directory_color
  set -gqu @catppuccin_session_color
  set -gqu @catppuccin_date_time_color
  set -gqu @catppuccin_cpu_color
  set -gqu @catppuccin_ram_color
  set -gqu @catppuccin_status_directory_icon_fg
  set -gqu @catppuccin_status_directory_icon_bg
  set -gqu @catppuccin_status_directory_text_fg
  set -gqu @catppuccin_status_session_icon_fg
  set -gqu @catppuccin_status_session_icon_bg
  set -gqu @catppuccin_status_session_text_fg
  set -gqu @catppuccin_status_date_time_icon_fg
  set -gqu @catppuccin_status_date_time_icon_bg
  set -gqu @catppuccin_status_date_time_text_fg
  set -gqu @catppuccin_status_cpu_icon_fg
  set -gqu @catppuccin_status_cpu_icon_bg
  set -gqu @catppuccin_status_ram_icon_fg
  set -gqu @catppuccin_status_ram_icon_bg
  run-shell "~/.config/tmux/plugins/tmux/catppuccin.tmux"
  set -g status-right "#{E:@catppuccin_status_directory}"
  set -ag status-right "#{E:@catppuccin_status_session}"
  set -ag status-right "#{E:@catppuccin_status_date_time}"
  set -agF status-right "#{E:@catppuccin_status_cpu}"
  set -agF status-right "#{E:@catppuccin_status_ram}"
  run-shell "~/.config/tmux/plugins/tmux-cpu/cpu.tmux"
}

# Automatic tpm installation https://github.com/tmux-plugins/tpm/blob/master/docs/automatic_tpm_installation.md
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Автоматична ініціалізація TPM (Завжди в самому кінці файлу!)
run '~/.config/tmux/plugins/tpm/tpm'

# Збірка status-right ПІСЛЯ TPM (щоб @catppuccin_status_* вже існували) +
# інтерполяція #{cpu_percentage}/#{ram_percentage} плагіном tmux-cpu
# (той сам замінює цей текст у status-right одноразовим пошуком-заміною,
# тому виклик після збірки і після хуків зміни теми обов'язковий)
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
run-shell "~/.config/tmux/plugins/tmux-cpu/cpu.tmux"
